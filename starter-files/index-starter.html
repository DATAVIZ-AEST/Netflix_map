<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where Netflix Titles Are Made</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: #1f2937;
            -webkit-font-smoothing: antialiased;
        }
        #map {
            width: 100vw;
            height: 100vh;
            background: #e5e7eb;
        }
        #header {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 14px 26px;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            text-align: center;
            width: max-content;
            max-width: calc(100vw - 340px);
            pointer-events: none;
        }
        #header h1 {
            margin: 0 0 4px 0;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: #111827;
        }
        #header p {
            margin: 0;
            font-size: 13.5px;
            color: #4b5563;
            letter-spacing: 0.01em;
        }
        #caption {
            position: absolute;
            bottom: 24px;
            right: 16px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            padding: 8px 14px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            font-size: 12.5px;
            color: #4b5563;
        }
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            font-size: 15px;
        }
        #loader.hidden {
            display: none;
        }
        #controls {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 14px;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            min-width: 140px;
        }
        .control-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6b7280;
            margin-bottom: 6px;
            font-weight: 600;
        }
        #controls hr {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 10px 0;
        }
        #controls button {
            display: block;
            width: 100%;
            padding: 7px 12px;
            margin-bottom: 5px;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            text-align: left;
            color: #374151;
            transition: all 0.15s ease;
        }
        #controls button:hover {
            background: #f9fafb;
            border-color: #d1d5db;
        }
        #controls button:last-child {
            margin-bottom: 0;
        }
        #controls button.active {
            background: #991b1b;
            color: white;
            border-color: #991b1b;
        }
        .leaflet-tooltip {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            padding: 10px 14px;
            border-radius: 6px;
        }
        .leaflet-tooltip h3 {
            margin-bottom: 4px;
            font-size: 16px;
            font-weight: 600;
        }
        .leaflet-tooltip .count {
            color: #4b5563;
            margin-bottom: 6px;
            font-size: 13.5px;
        }
        .leaflet-tooltip ul {
            padding-left: 16px;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="loader"><span id="loader-text">Loading…</span></div>
    <div id="header">
        <h1>Where Netflix’s Most-Watched Titles Are Made</h1>
        <p>Top 100 movies &amp; 100 TV shows by production country · Compare title volume vs. total views</p>
    </div>
    <div id="controls">
        <div class="control-label">Format</div>
        <button id="btn-all" class="active">All</button>
        <button id="btn-movie">Movies</button>
        <button id="btn-tv">TV shows</button>

        <hr>

        <div class="control-label">Metric</div>
        <button id="btn-metric-count" class="active">Title Count</button>
        <button id="btn-metric-views">Total Views</button>
    </div>
    <div id="caption">Countries where the most-watched Netflix titles were produced · Data: Netflix, TMDB</div>
    <div id="map"></div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="./js/app-starter.js"></script>
</body>
</html>
